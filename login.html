
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - NEXIX</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <!-- CLOUDFLARE TURNSTILE -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>
</head>

<body>

<main class="login-page">

    <!-- PANEL IZQUIERDO -->

    <section class="login-panel">

        <div class="login-content">

            <!-- LOGO -->

            <a href="/" class="logo">
                ✦ NEXIX
            </a>


            <!-- FORMULARIO -->

            <form
                class="form-container"
                id="loginForm"
            >

                <!-- CABECERA -->

                <div class="heading">

                    <span>
                        Bienvenido de nuevo
                    </span>

                    <h1>
                        Iniciar sesión
                    </h1>

                    <p>
                        Inicia sesión para continuar
                        usando NEXIX.
                    </p>

                </div>


                <!-- CORREO -->

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="tu@email.com"
                    autocomplete="email"
                    required
                >


                <!-- CONTRASEÑA -->

                <label for="password">
                    Contraseña
                </label>

                <div class="password-wrapper">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Mostrar contraseña"
                    >
                        ◉
                    </button>

                </div>


                <!-- TURNSTILE -->

                <div
                    class="cf-turnstile"
                    data-sitekey="0x4AAAAAAEZUYXHJYKOaceE_"
                    data-theme="light"
                ></div>


                <!-- INICIAR SESIÓN -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Iniciar sesión
                </button>


                <!-- SEPARADOR -->

                <div class="divider">

                    <span>
                        o continúa con
                    </span>

                </div>


                <!-- REDES SOCIALES -->

                <div class="social-buttons">

                    <!-- GOOGLE -->

                    <button
                        type="button"
                        class="social-button"
                        id="googleLogin"
                        aria-label="Continuar con Google"
                        title="Continuar con Google"
                    >

                        <img
                            src="img/googlelogo.webp"
                            alt="Google"
                            class="social-logo"
                        >

                    </button>


                    <!-- DISCORD -->

                    <button
                        type="button"
                        class="social-button"
                        id="discordLogin"
                        aria-label="Continuar con Discord"
                        title="Continuar con Discord"
                    >

                        <img
                            src="img/discordlogo.png"
                            alt="Discord"
                            class="social-logo"
                        >

                    </button>


                    <!-- GITHUB -->

                    <button
                        type="button"
                        class="social-button"
                        id="githubLogin"
                        aria-label="Continuar con GitHub"
                        title="Continuar con GitHub"
                    >

                        <img
                            src="img/githublogo.png"
                            alt="GitHub"
                            class="social-logo"
                        >

                    </button>

                </div>


                <!-- REGISTRO -->

                <p class="signup-text">

                    ¿No tienes una cuenta?

                    <a href="/register.html">
                        Crear cuenta
                    </a>

                </p>


                <!-- INVITADO -->

                <a
                    href="/chat.html"
                    class="guest-button"
                >
                    Continuar sin cuenta →
                </a>

            </form>

        </div>

    </section>


    <!-- PANEL DERECHO -->

    <section class="visual-panel">

        <div class="visual-background"></div>

        <div class="visual-content">

            <div class="nexix-symbol">
                ✦
            </div>

            <h2>
                Tu Inteligencia.
                <br>
                A tu alcance.
            </h2>

            <p>
                Inicia sesión y disfruta de
                una experiencia personalizada
                con NEXIX AI.
            </p>

        </div>

    </section>

</main>


<script src="login.js"></script>

</body>
</html>
